</head>

<body>

        <div class="ll">Grapreneur</div>
        <div class="lb">
            <div class="lf"></div>
        </div>
    </div>
    <div id="cur"></div>
    <div id="cur2"></div>

    <nav id="nav">
        <div class="logo">Grapreneur</div>

    <section class="form-section">
        <div class="con">
            <div class="form-header rev">
                <div class="sl">Network</div>
                <h2>Join Our Community</h2>
                <p class="sd" style="margin:0 auto">Connect with the next generation of founders as a mentor, partner,
                    or investor.</p>
            </div>

            <form class="form-card rev" id="joinForm">
                <div class="form-grid-2">
                    <div class="inp-grp">
                        <label class="inp-lbl">First Name <span class="req">*</span></label>
                        <input type="text" name="First Name" class="inp-field" placeholder="John" required>
                    </div>
                    <div class="inp-grp">
                        <label class="inp-lbl">Last Name <span class="req">*</span></label>
                        <input type="text" name="Last Name" class="inp-field" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="inp-grp">
                        <label class="inp-lbl">Email Address <span class="req">*</span></label>
                        <input type="email" name="Email Address" class="inp-field" placeholder="john@company.com"
                            required>
                    </div>
                    <div class="inp-grp">
                        <label class="inp-lbl">Phone number <span class="req">*</span></label>
                        <input type="tel" name="Phone number" class="inp-field" placeholder="+91 98765 43210" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="inp-grp">
                        <label class="inp-lbl">Current Organization <span class="req">*</span></label>
                        <input type="text" name="Current Organization" class="inp-field"
                            placeholder="Company / Institution Name" required>
                    </div>
                    <div class="inp-grp">
                        <label class="inp-lbl">Current Designation/Role <span class="req">*</span></label>
                        <input type="text" name="Current Designation/Role" class="inp-field"
                            placeholder="e.g. Senior Product Manager" required>
                    </div>
                </div>

                <div class="inp-grp">
                    <label class="inp-lbl">Role of Interest <span class="req">*</span></label>
                    <select name="Role of Interest" class="inp-field" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="Mentor - Guide students with expertise">Mentor - Guide students with expertise
                        </option>
                        <option value="Associate - Support program activities">Associate - Support program activities
                        </option>
                        <option value="Partner - Collaborate on initiatives">Partner - Collaborate on initiatives
                        </option>
                        <option value="Investor - Provide funding opportunities">Investor - Provide funding
                            opportunities</option>
                    </select>
                </div>

                <div class="inp-grp">
                    <label class="inp-lbl">Areas of Expertise <span class="req">*</span></label>
                    <input type="text" name="Areas of Expertise" class="inp-field"
                        placeholder="e.g. Technology, Marketing, Finance, Legal" required>
                </div>

                <div class="form-grid-2">
                    <div class="inp-grp">
                        <label class="inp-lbl">Years of Experience <span class="req">*</span></label>
                        <select name="Years of Experience" class="inp-field" required>
                            <option value="0-2 years">0-2 years</option>
                            <option value="3-5 years">3-5 years</option>
                            <option value="5-10 years">5-10 years</option>
                            <option value="10+ years">10+ years</option>
                        </select>
                    </div>
                    <div class="inp-grp">
                        <label class="inp-lbl">Time Availability <span class="req">*</span></label>
                        <select name="Time Availability" class="inp-field" required>
                            <option value="1-2 hours/week">1-2 hours/week</option>
                            <option value="3-5 hours/week">3-5 hours/week</option>
                            <option value="5+ hours/week">5+ hours/week</option>
                            <option value="Weekends only">Weekends only</option>
                        </select>
                    </div>
                </div>

                <div class="inp-grp">
                    <label class="inp-lbl">Why do you want to join our community?</label>
                    <textarea name="Why do you want to join our community?" class="inp-field inp-area"></textarea>
                </div>

                <div class="inp-grp">
                    <label class="inp-lbl">Previous Mentoring/Volunteering Experience <span class="req">*</span></label>
                    <textarea name="Previous Mentoring/Volunteering Experience" class="inp-field inp-area"
                        required></textarea>
                </div>

                <label class="chk-grp">
                    <input type="checkbox" name="I agree to the Terms and Conditions and Privacy Policy" class="chk-inp"
                        value="Yes" required>
                    I agree to the terms and conditions and privacy policy <span class="req">*</span>
                </label>

                <button type="submit" class="bp" id="submitBtn"
                    style="width:100%;margin-top:1rem; cursor: pointer;">Submit Application</button>
            </form>
        </div>
    </section>
    <footer>
        <div class="fb"><span>© 2026 Grapreneur. All rights reserved.</span></div>
    </footer>
    <script src="main.js"></script>
    <script>
        // Replace this with your actual Web App URL from the Google Script Deployment
        // IMPORTANT: Ensure your Google Sheet headers match the 'name' attributes in the form exactly!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzeIn4bSR5RNYjB_iziaVmRQkeCTGl-hJLFdwwg1YNVwkIqUtm8N9JCRIOfcOTZfHnJbA/exec';

        document.getElementById('submitBtn').addEventListener('click', function (e) {
            e.preventDefault();
            const form = document.getElementById('joinForm');
            let valid = true;

            // Reset previous error styles
            form.querySelectorAll('.inp-field').forEach(el => el.style.borderColor = '');
            form.querySelectorAll('.chk-grp').forEach(el => el.style.color = '');

            // Validate Text/Select Inputs
            form.querySelectorAll('.inp-grp').forEach(group => {
                if (group.querySelector('.req')) {
                    const input = group.querySelector('.inp-field');
                    if (input && !input.value.trim()) {
                        input.style.borderColor = '#ef4444';
                        valid = false;
                    }
                }
            });

            // Validate Checkboxes
            form.querySelectorAll('.chk-grp').forEach(chk => {
                if (chk.querySelector('.req') && !chk.querySelector('input').checked) {
                    chk.style.color = '#ef4444';
                    valid = false;
                }
            });

            if (valid) {
                const btn = document.getElementById('submitBtn');
                btn.disabled = true;
                btn.innerText = 'Submitting...';

                fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                    .then(response => {
                        return response.json();
                    })
                    .then(data => {
                        if (data.result === 'success') {
                            setTimeout(() => {
                                form.innerHTML = '<div style="text-align:center;padding:2rem"><div style="font-size:3rem;margin-bottom:1rem">🎉</div><h3 style="font-size:1.5rem;color:#fff;margin-bottom:0.5rem">Application Submitted!</h3><p style="color:var(--muted)">Thank you for applying. We will get back to you shortly.</p><a href="index.html" class="bp" style="margin-top:1.5rem">Back to Home</a></div>';
                                form.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 3000);
                        } else {
                            throw new Error(data.message || 'Script Error');
                        }
                    })
                    .catch(error => {
                        console.error('Error!', error.message);
                        btn.innerText = 'Error! Try Again';
                        btn.disabled = false;
                    });
            }
        });
    </script>
</body>

</html>
